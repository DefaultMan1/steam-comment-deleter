<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">Review, then delete Steam comments</title>
<desc id="desc">Filters and Activity start collapsed. Review highlights matching comments. Confirm the count and scope before deletion. Stop prevents subsequent clicks.</desc>
<rect width="740" height="300" rx="8" fill="#171d25"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#d6e3ec">
<text x="24" y="36" font-size="18" font-weight="600">Delete comments in two steps</text>
<text x="24" y="65" font-size="13" fill="#91a4b2">Choose a scope in Filters &amp; options. Filters and Activity start closed.</text>
<rect x="24" y="88" width="328" height="158" rx="5" fill="#1b2838" stroke="#354451"/>
<text x="40" y="117" font-size="15">6 comments selected</text>
<text x="40" y="141" font-size="12" fill="#91a4b2">Current page only</text>
<rect x="40" y="163" width="296" height="36" rx="4" fill="#216b94"/>
<text x="188" y="186" text-anchor="middle" font-size="13">Scan comments</text>
<text x="40" y="226" font-size="12" fill="#91a4b2">This step deletes nothing.</text>
<rect x="372" y="88" width="344" height="158" rx="5" fill="#1b2838" stroke="#354451"/>
<text x="388" y="117" font-size="15">Check the outlined comments and scope</text>
<text x="388" y="141" font-size="12" fill="#91a4b2">Cancel returns to the initial view.</text>
<rect x="388" y="163" width="312" height="36" rx="4" fill="#9f3e49"/>
<text x="544" y="186" text-anchor="middle" font-size="13">Delete 6 comments</text>
<text x="388" y="226" font-size="12" fill="#e5a83b">Deletion is permanent.</text>
<text x="24" y="279" font-size="12" fill="#91a4b2">Stop appears during a run. Steam may finish a request already submitted.</text>
</g></svg>
